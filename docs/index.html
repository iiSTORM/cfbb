<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFB Prop Matchup Report</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="freshness-banner"></div>
  <div class="shell">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title display">This Week</div>
        <div class="sidebar-sub" id="sidebar-sub">Loading matchups…</div>
        <input type="text" id="player-search" class="player-search" placeholder="Search players…" autocomplete="off">
        <button id="csv-export-btn" class="csv-export-btn" type="button">Download CSV</button>
      </div>
      <div id="matchup-list"></div>
      <div id="track-record"></div>
    </nav>
    <main class="main" id="main">
      <div class="empty-state">
        <div class="empty-state-title display">Loading report…</div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
